name: Firebase

on:
  pull_request:
    paths:
      - "firebase/**"
      - "functions/**"
      - "firebase.json"
      - "scripts/seed/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy rules and indexes to"
        required: true
        type: choice
        options: [staging, prod]

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test dependencies
        run: npm ci
        working-directory: firebase/tests
      - name: Rules tests (emulator)
        run: npm test
        working-directory: firebase/tests
      - name: Backend typecheck and tests (Auth emulator)
        run: |
          npm ci
          npm run typecheck
          npm test
        working-directory: functions
      - name: Validate seed catalog
        run: |
          npm ci
          npm run seed:dry
        working-directory: scripts/seed

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: rules-tests
    runs-on: ubuntu-latest
    # Configure required reviewers on these GitHub Environments so a person approves every deploy.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keyless auth (Workload Identity Federation): no service-account JSON in the repo.
      # Set these as variables on each GitHub Environment.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy rules and indexes
        run: >
          npx --yes firebase-tools deploy
          --only firestore:rules,firestore:indexes,storage
          --project ${{ vars.FIREBASE_PROJECT_ID }}
